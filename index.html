<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharmarocks — Disease & Treatment Reference</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080d18;
      --bg2:       #0d1526;
      --bg3:       #111c35;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(79,134,247,0.22);
      --text:      #dde8fc;
      --text2:     #7a9cc8;
      --text3:     #3a5474;
      --accent:    #4f86f7;
      --accent2:   #a78bfa;
      --mono:      'Space Mono', monospace;
      --sans:      'Plus Jakarta Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #1e3058; border-radius: 4px; }

    /* ══════════════════════════ HEADER ══════════════════════════ */
    .header {
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border-bottom: 1px solid var(--border2);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-logo {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(79,134,247,0.35);
    }
    .header-title {
      font-family: var(--mono);
      font-size: 19px; font-weight: 700;
      background: linear-gradient(90deg, #7bb8ff, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sub {
      font-size: 11px; color: var(--text3);
      letter-spacing: .1em; text-transform: uppercase; margin-top: 2px;
    }
    .header-badge {
      margin-left: auto;
      background: rgba(79,134,247,.1);
      border: 1px solid rgba(79,134,247,.25);
      border-radius: 8px;
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: 10px; color: #7bb8ff;
      letter-spacing: .08em;
    }

    /* ══════════════════════════ LAYOUT ══════════════════════════ */
    .layout {
      max-width: 1300px;
      margin: 0 auto;
      padding: 28px 32px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }

    /* ══════════════════════════ SIDEBAR ══════════════════════════ */
    .sidebar {
      width: 310px;
      flex-shrink: 0;
      position: sticky;
      top: 84px;
    }
    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); font-size: 15px; pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 13.5px;
      font-family: var(--sans);
      transition: border-color .2s;
    }
    .search-input::placeholder { color: var(--text3); }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* Category chips */
    .cat-strip {
      display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px;
    }
    .cat-btn {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      font-family: var(--mono);
      transition: all .18s;
    }
    .cat-btn:hover { background: rgba(79,134,247,.12); color: #7bb8ff; }
    .cat-btn.active {
      border-color: var(--accent);
      background: rgba(79,134,247,.18);
      color: #7bb8ff;
    }

    /* Disease list box */
    .disease-box {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .disease-box-header {
      padding: 9px 15px;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono); font-size: 10px; color: var(--text3);
      letter-spacing: .1em;
    }
    .disease-list {
      max-height: calc(100vh - 310px);
      overflow-y: auto;
    }
    .disease-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 15px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.03);
      border-left: 3px solid transparent;
      transition: all .16s;
    }
    .disease-item:hover {
      background: rgba(79,134,247,.1);
      transform: translateX(2px);
    }
    .disease-item.active {
      background: rgba(79,134,247,.14);
      border-left-color: var(--accent);
    }
    .disease-num {
      width: 24px; height: 24px;
      border-radius: 7px;
      background: rgba(255,255,255,.05);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 9px; color: var(--text3);
      flex-shrink: 0;
    }
    .disease-item.active .disease-num {
      background: rgba(79,134,247,.25); color: #7bb8ff;
    }
    .disease-name {
      font-size: 13px; color: var(--text2);
      transition: color .16s;
    }
    .disease-item.active .disease-name,
    .disease-item:hover .disease-name { color: #9dc4f7; font-weight: 500; }
    .no-results { padding: 24px; text-align: center; color: var(--text3); font-size: 13px; }

    /* ══════════════════════════ CONTENT PANEL ══════════════════════════ */
    .content { flex: 1; min-width: 0; }

    /* Empty state */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 480px; text-align: center;
    }
    .empty-icon { font-size: 72px; opacity: .25; margin-bottom: 20px; }
    .empty-title {
      font-family: var(--mono); font-size: 26px; font-weight: 700;
      color: var(--text3); margin-bottom: 10px;
    }
    .empty-desc { color: var(--text3); font-size: 14px; max-width: 340px; line-height: 1.75; }
    .quick-picks { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
    .quick-btn {
      padding: 7px 16px; border-radius: 20px;
      background: rgba(79,134,247,.1);
      border: 1px solid rgba(79,134,247,.22);
      color: #6aa0df; font-size: 12.5px;
      cursor: pointer; font-family: var(--sans);
      transition: all .18s;
    }
    .quick-btn:hover { background: rgba(79,134,247,.2); color: #9dc4f7; }

    /* Disease header card */
    .disease-header {
      background: linear-gradient(135deg, rgba(79,134,247,.1), rgba(167,139,250,.07));
      border: 1px solid rgba(79,134,247,.22);
      border-radius: 20px;
      padding: 26px 30px;
      margin-bottom: 22px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .disease-header-label {
      font-family: var(--mono); font-size: 10px; color: var(--accent);
      text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px;
    }
    .disease-header-name {
      font-family: var(--mono); font-size: 28px; font-weight: 700;
      background: linear-gradient(90deg, #fff, #a8c8f0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px; line-height: 1.2;
    }
    .section-tags { display: flex; gap: 7px; flex-wrap: wrap; }
    .section-tag {
      padding: 3px 9px; border-radius: 10px;
      font-family: var(--mono); font-size: 10px;
    }
    .back-btn {
      padding: 8px 16px; border-radius: 10px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      color: var(--text2); cursor: pointer;
      font-family: var(--mono); font-size: 11px;
      white-space: nowrap; transition: all .18s; flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,.09); color: var(--text); }

    /* Loading */
    .loading-box {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px; text-align: center;
    }
    .dots { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 14px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: scale(.65); opacity: .35; }
      40%          { transform: scale(1);   opacity: 1;    }
    }
    .loading-label { font-family: var(--mono); font-size: 12px; color: var(--text3); letter-spacing: .1em; }

    /* Error */
    .error-box {
      background: rgba(247,79,79,.07);
      border: 1px solid rgba(247,79,79,.2);
      border-radius: 14px; padding: 20px 24px;
      color: #f78080; font-size: 14px;
    }

    /* Section cards */
    .section-card {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 14px;
      opacity: 0; transform: translateY(14px);
      transition: opacity .4s ease, transform .4s ease, border-color .3s;
    }
    .section-card.visible { opacity: 1; transform: translateY(0); }
    .section-card:hover { border-color: rgba(255,255,255,.12); }

    .section-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .section-icon-wrap {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .section-title {
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
    }
    /* plain text */
    .section-text { color: #b8cde4; font-size: 13.5px; line-height: 1.8; }
    /* bullet list */
    .bullet-list { list-style: none; }
    .bullet-list li {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,.04);
      font-size: 13.5px; color: #b8cde4; line-height: 1.65;
    }
    .bullet-list li:last-child { border-bottom: none; }
    .bullet-dot {
      width: 6px; height: 6px; border-radius: 50%;
      margin-top: 7px; flex-shrink: 0;
    }
    /* sub-group (object) */
    .sub-group { margin-bottom: 16px; }
    .sub-group:last-child { margin-bottom: 0; }
    .sub-label {
      font-family: var(--mono); font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em;
      opacity: .75; margin-bottom: 8px;
    }

    /* Disclaimer */
    .disclaimer {
      margin-top: 10px; padding: 11px 16px;
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 10px;
      font-family: var(--mono); font-size: 10px; color: #263a54; line-height: 1.6;
    }

    /* ══════════════════════════ RESPONSIVE ══════════════════════════ */
    @media (max-width: 860px) {
      .layout { flex-direction: column; padding: 18px; gap: 20px; }
      .sidebar { width: 100%; position: static; }
      .disease-list { max-height: 260px; }
      .header { padding: 14px 18px; }
      .disease-header { flex-direction: column; }
      .header-badge { display: none; }
    }
    @media (max-width: 520px) {
      .disease-header-name { font-size: 22px; }
    }
  </style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header class="header">
  <div class="header-logo">💊</div>
  <div>
    <div class="header-title">Pharmarocks Reference</div>
    <div class="header-sub">Diseases &amp; Treatment Guide · 124 Conditions</div>
  </div>
  <div class="header-badge">AI-POWERED</div>
</header>

<!-- ══════════════ MAIN LAYOUT ══════════════ -->
<div class="layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" placeholder="Search diseases…" autocomplete="off" />
    </div>

    <div class="cat-strip" id="catStrip"></div>

    <div class="disease-box">
      <div class="disease-box-header" id="countLabel">124 CONDITIONS</div>
      <div class="disease-list" id="diseaseList"></div>
    </div>
  </aside>

  <!-- ── CONTENT ── -->
  <main class="content" id="contentPanel">

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📖</div>
      <div class="empty-title">Select a Disease</div>
      <p class="empty-desc">Choose any condition from the panel to get treatment details, medications, and remedies.</p>
      <div class="quick-picks" id="quickPicks"></div>
    </div>

    <div id="diseaseView" style="display:none;">
      <div class="disease-header">
        <div>
          <div class="disease-header-label">PHARMAROCKS REFERENCE</div>
          <div class="disease-header-name" id="viewTitle"></div>
          <div class="section-tags" id="viewTags"></div>
        </div>
        <button class="back-btn" id="backBtn">← BACK</button>
      </div>

      <div id="loadingBox" class="loading-box" style="display:none;">
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="loading-label">LOADING REFERENCE DATA…</div>
      </div>

      <div id="errorBox" class="error-box" style="display:none;"></div>
      <div id="sectionsContainer"></div>
    </div>

  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════ */
const DISEASES = [
  "Acne (Pimple)","Acute Hepatic Porphyria","Allergy","Amenorrhea","Anemia",
  "Angina Pectoris","Anxiety","Arrhythmia","Arthritis","Asthma","Bell's Palsy",
  "Blood Sugar / Diabetes","Boils","Breast Cancer","Breast Enlargement",
  "Burning Feet","Burns","Cancer","Cervical Dysplasia","Chikungunya",
  "Congestive Heart Failure","Conjunctivitis","Constipation","Cystitis",
  "Dehydration","Dengue Fever","Dental Infection","Depression","Dry Cough",
  "Dysentery","Eczema","Erectile Dysfunction","Fatty Liver","Fever",
  "Gall Bladder Stone","Gas Trouble","Gastritis","Giardiasis","Glaucoma",
  "H. Pylori Infection","Hair Fall","Headache","Heat Stroke","Hemophilia",
  "Hepatitis","HFMD (Hand, Foot & Mouth Disease)","Hiccups","Hysteria",
  "HIV / AIDS","Hydrocele","Hyperhidrosis","Hypertension","Hypothyroidism",
  "IBS (Irritable Bowel Syndrome)","Infertility (Female)","Infertility (Male)",
  "Inflammatory Bowel Disease","Insomnia","Jaundice","Joint Pain","Kidney Stone",
  "Leprosy","Leucorrhoea","Liver Cirrhosis","Low Platelet Count","Lymphoma",
  "Malaria","Meningitis","Migraine","Morning Sickness","Mouth Ulcer",
  "Multiple Sclerosis","Muscular Dystrophy","NAFLD","Nausea","Nerve Pain",
  "Night Fall","Obesity","Ocular Hypertension","Oral Thrush","Ovarian Cyst",
  "Paralysis","Pelvic Pain","PID (Pelvic Inflammatory Disease)","Peptic Ulcer",
  "Phimosis","Pneumonia","PCOD (Polycystic Ovarian Disease)","Pus Formation",
  "Respiratory Tract Infection","Rheumatoid Arthritis","Ringworm","Schizophrenia",
  "Scurvy","Skin Diseases","Scabies","Splenomegaly","Thyroid Disorders",
  "Tooth Pain","Tremor","Tuberculosis","Typhoid Fever","Urinary Tract Infection",
  "Vaginal Discharge","Vaginal Dryness","Vaginal Infection","Varicocele",
  "Vertigo","Viral Fever","Viral Infection","Vomiting","Vulvovaginitis",
  "Weakness and Tiredness","Wet Cough","Worm Infection","Ear Infection",
  "Chronic Kidney Disease","Piles (Hemorrhoids)","Psoriasis","Chickenpox","Vitiligo"
];

const CATEGORIES = {
  "All": DISEASES,
  "Skin & Hair": ["Acne (Pimple)","Boils","Burns","Eczema","Hair Fall","Leprosy","Psoriasis","Ringworm","Scabies","Skin Diseases","Vitiligo","Chickenpox"],
  "Digestive":   ["Constipation","Dysentery","Fatty Liver","Gas Trouble","Gastritis","Giardiasis","H. Pylori Infection","IBS (Irritable Bowel Syndrome)","Inflammatory Bowel Disease","Jaundice","Liver Cirrhosis","NAFLD","Peptic Ulcer","Piles (Hemorrhoids)","Vomiting","Worm Infection"],
  "Heart":       ["Anemia","Angina Pectoris","Arrhythmia","Congestive Heart Failure","Hemophilia","Hypertension","Low Platelet Count","Lymphoma"],
  "Respiratory": ["Asthma","Dry Cough","Pneumonia","Respiratory Tract Infection","Tuberculosis","Wet Cough"],
  "Bones":       ["Arthritis","Joint Pain","Multiple Sclerosis","Muscular Dystrophy","Paralysis","Rheumatoid Arthritis","Tremor"],
  "Mental":      ["Anxiety","Depression","Hysteria","Insomnia","Schizophrenia"],
  "Women":       ["Amenorrhea","Breast Cancer","Breast Enlargement","Cervical Dysplasia","Infertility (Female)","Morning Sickness","Ovarian Cyst","PCOD (Polycystic Ovarian Disease)","Pelvic Pain","PID (Pelvic Inflammatory Disease)","Vaginal Discharge","Vaginal Dryness","Vaginal Infection","Vulvovaginitis"],
  "Men":         ["Erectile Dysfunction","Hydrocele","Infertility (Male)","Night Fall","Phimosis","Varicocele"],
  "Eyes/ENT":    ["Bell's Palsy","Conjunctivitis","Ear Infection","Glaucoma","Headache","Migraine","Ocular Hypertension","Vertigo"],
  "Infections":  ["Chikungunya","Dengue Fever","Fever","HFMD (Hand, Foot & Mouth Disease)","HIV / AIDS","Malaria","Meningitis","Typhoid Fever","Viral Fever","Viral Infection"],
  "Kidney":      ["Chronic Kidney Disease","Cystitis","Gall Bladder Stone","Kidney Stone","Urinary Tract Infection"],
  "Metabolic":   ["Blood Sugar / Diabetes","Dehydration","Fatty Liver","Heat Stroke","Hypothyroidism","Obesity","Thyroid Disorders","Weakness and Tiredness"],
};

const QUICK = ["Blood Sugar / Diabetes","Hypertension","Asthma","Malaria","Anxiety","Dengue Fever"];

const SECTIONS = [
  { key:"overview",      label:"Overview",          icon:"📋", color:"#4f86f7" },
  { key:"causes",        label:"Causes",            icon:"🔬", color:"#f7934f" },
  { key:"symptoms",      label:"Symptoms",          icon:"🩺", color:"#f74f7b" },
  { key:"diagnosis",     label:"Diagnosis",         icon:"🧪", color:"#9b4ff7" },
  { key:"treatment",     label:"Treatment Options", icon:"💊", color:"#4ff77a" },
  { key:"medications",   label:"Medications",       icon:"🏥", color:"#4fc5f7" },
  { key:"home_remedies", label:"Home Remedies",     icon:"🌿", color:"#f7d84f" },
];

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let activeCategory = "All";
let selectedDisease = null;
let searchQuery = "";

/* ═══════════════════════════════════════════════════
   DOM HELPERS
═══════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════
   BUILD SIDEBAR
═══════════════════════════════════════════════════ */
function buildCategories() {
  const strip = $("catStrip");
  Object.keys(CATEGORIES).forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === "All" ? " active" : "");
    btn.textContent = cat;
    btn.dataset.cat = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      strip.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
      renderList();
    });
    strip.appendChild(btn);
  });
}

function renderList() {
  const list = $("diseaseList");
  const pool = CATEGORIES[activeCategory] || DISEASES;
  const q = searchQuery.toLowerCase();
  const filtered = pool.filter(d => d.toLowerCase().includes(q));

  $("countLabel").textContent = filtered.length + " CONDITIONS";
  list.innerHTML = "";

  if (!filtered.length) {
    list.innerHTML = '<div class="no-results">No diseases found</div>';
    return;
  }

  filtered.forEach((disease, i) => {
    const item = document.createElement("div");
    item.className = "disease-item" + (disease === selectedDisease ? " active" : "");
    item.innerHTML = `<div class="disease-num">${i + 1}</div><div class="disease-name">${disease}</div>`;
    item.addEventListener("click", () => selectDisease(disease));
    list.appendChild(item);
  });
}

/* ═══════════════════════════════════════════════════
   QUICK PICKS
═══════════════════════════════════════════════════ */
function buildQuickPicks() {
  const wrap = $("quickPicks");
  QUICK.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "quick-btn";
    btn.textContent = name;
    btn.addEventListener("click", () => selectDisease(name));
    wrap.appendChild(btn);
  });
}

/* ═══════════════════════════════════════════════════
   SELECT & FETCH
═══════════════════════════════════════════════════ */
function selectDisease(disease) {
  selectedDisease = disease;
  renderList();

  $("emptyState").style.display  = "none";
  $("diseaseView").style.display = "block";
  $("viewTitle").textContent     = disease;
  $("sectionsContainer").innerHTML = "";
  $("errorBox").style.display    = "none";

  // Tags
  const tags = $("viewTags");
  tags.innerHTML = "";
  SECTIONS.forEach(s => {
    const span = document.createElement("span");
    span.className = "section-tag";
    span.style.cssText = `background:${s.color}18;border:1px solid ${s.color}33;color:${s.color};`;
    span.textContent = s.label;
    tags.appendChild(span);
  });

  // Scroll
  window.scrollTo({ top: 0, behavior: "smooth" });

  fetchDisease(disease);
}

async function fetchDisease(disease) {
  $("loadingBox").style.display = "flex";
  $("loadingBox").style.flexDirection = "column";
  $("loadingBox").style.display = "block";

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are a medical reference assistant based on the "Diseases and Treatment" book by Pharmarocks.
Provide comprehensive pharmaceutical and medical information strictly as valid JSON only.
No markdown, no backticks, no preamble — raw JSON only.

Required structure:
{
  "overview": "2-3 sentence clinical description",
  "causes": ["cause 1", "cause 2", ...],
  "symptoms": ["symptom 1", ...],
  "diagnosis": ["method 1", ...],
  "treatment": {
    "Allopathy": ["treatment 1", ...],
    "Homeopathy": ["remedy 1"],
    "Ayurvedic": ["treatment 1"]
  },
  "medications": {
    "Drug Class (e.g. Antibiotics)": ["Drug: dose frequency", ...],
    "Topical / External": ["..."]
  },
  "home_remedies": ["remedy 1", ...]
}

Rules:
- Include specific drug names with doses where known
- 4-8 items per array; keep concise but clinically complete
- Group medications by drug class
- Empty array [] if section does not apply`,
        messages: [{ role: "user", content: `Provide medical reference for: ${disease}` }]
      })
    });

    const data = await res.json();
    const raw  = data.content?.find(b => b.type === "text")?.text || "";
    const clean = raw.replace(/```json\s*|```/g, "").trim();
    const parsed = JSON.parse(clean);

    $("loadingBox").style.display = "none";
    renderSections(parsed);

  } catch(e) {
    $("loadingBox").style.display = "none";
    const eb = $("errorBox");
    eb.textContent = "⚠ Could not load data. Please try again.";
    eb.style.display = "block";
  }
}

/* ═══════════════════════════════════════════════════
   RENDER SECTIONS
═══════════════════════════════════════════════════ */
function renderSections(data) {
  const container = $("sectionsContainer");
  container.innerHTML = "";

  SECTIONS.forEach((sec, idx) => {
    const val = data[sec.key];
    if (!val || (Array.isArray(val) && !val.length) || (typeof val === "object" && !Array.isArray(val) && !Object.keys(val).length)) return;

    const card = document.createElement("div");
    card.className = "section-card";

    // Header
    card.innerHTML = `
      <div class="section-head">
        <div class="section-icon-wrap" style="background:${sec.color}1a;border:1px solid ${sec.color}33;">
          ${sec.icon}
        </div>
        <div class="section-title" style="color:${sec.color};">${sec.label}</div>
      </div>
      <div class="section-body"></div>
    `;

    const body = card.querySelector(".section-body");

    if (typeof val === "string") {
      body.innerHTML = `<p class="section-text">${val}</p>`;
    } else if (Array.isArray(val)) {
      body.appendChild(buildBulletList(val, sec.color));
    } else if (typeof val === "object") {
      Object.entries(val).forEach(([subKey, subVal]) => {
        if (!subVal || (Array.isArray(subVal) && !subVal.length)) return;
        const group = document.createElement("div");
        group.className = "sub-group";
        group.innerHTML = `<div class="sub-label" style="color:${sec.color};">${subKey}</div>`;
        if (Array.isArray(subVal)) group.appendChild(buildBulletList(subVal, sec.color, true));
        else group.innerHTML += `<p class="section-text" style="font-size:13px;">${subVal}</p>`;
        body.appendChild(group);
      });
    }

    container.appendChild(card);

    // Stagger animation
    setTimeout(() => card.classList.add("visible"), idx * 110);
  });

  // Disclaimer
  const disc = document.createElement("div");
  disc.className = "disclaimer";
  disc.innerHTML = "⚠ DISCLAIMER: This reference is for educational purposes only. Always consult a qualified healthcare professional before starting any treatment or medication.";
  container.appendChild(disc);
}

function buildBulletList(items, color, small = false) {
  const ul = document.createElement("ul");
  ul.className = "bullet-list";
  items.forEach(item => {
    const li = document.createElement("li");
    li.style.fontSize = small ? "13px" : "13.5px";
    li.innerHTML = `<span class="bullet-dot" style="background:${color};"></span><span>${item}</span>`;
    ul.appendChild(li);
  });
  return ul;
}
