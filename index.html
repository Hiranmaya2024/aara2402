<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pharmarocks — Disease &amp; Treatment Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080d18;--bg2:#0d1526;--bg3:#111c35;
  --border:rgba(255,255,255,.07);--border2:rgba(79,134,247,.22);
  --text:#dde8fc;--text2:#7a9cc8;--text3:#3a5474;
  --accent:#4f86f7;--accent2:#a78bfa;
  --mono:'Space Mono',monospace;--sans:'Plus Jakarta Sans',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.6}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#1e3058;border-radius:4px}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border2);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.hdr-logo{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;box-shadow:0 4px 20px rgba(79,134,247,.3)}
.hdr-title{font-family:var(--mono);font-size:18px;font-weight:700;background:linear-gradient(90deg,#7bb8ff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.hdr-badge{margin-left:auto;background:rgba(79,134,247,.1);border:1px solid rgba(79,134,247,.25);border-radius:8px;padding:5px 12px;font-family:var(--mono);font-size:10px;color:#7bb8ff;letter-spacing:.08em;white-space:nowrap}

/* LAYOUT */
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px;display:flex;gap:26px;align-items:flex-start}

/* SIDEBAR */
.sidebar{width:300px;flex-shrink:0;position:sticky;top:80px}
.search-wrap{position:relative;margin-bottom:13px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.search-inp{width:100%;padding:10px 12px 10px 36px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:13px;font-family:var(--sans);transition:border-color .2s}
.search-inp::placeholder{color:var(--text3)}
.search-inp:focus{outline:none;border-color:var(--accent)}
.cat-strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}
.cat-btn{padding:4px 9px;border-radius:18px;font-size:10px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:var(--mono);transition:all .18s}
.cat-btn:hover{background:rgba(79,134,247,.1);color:#7bb8ff}
.cat-btn.active{border-color:var(--accent);background:rgba(79,134,247,.18);color:#7bb8ff}
.d-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:13px;overflow:hidden}
.d-box-hdr{padding:8px 14px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.1em}
.d-list{max-height:calc(100vh - 290px);overflow-y:auto}
.d-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03);border-left:3px solid transparent;transition:all .15s}
.d-item:hover{background:rgba(79,134,247,.09);transform:translateX(2px)}
.d-item.active{background:rgba(79,134,247,.14);border-left-color:var(--accent)}
.d-num{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--text3);flex-shrink:0}
.d-item.active .d-num{background:rgba(79,134,247,.25);color:#7bb8ff}
.d-name{font-size:13px;color:var(--text2);transition:color .15s}
.d-item.active .d-name,.d-item:hover .d-name{color:#9dc4f7;font-weight:500}
.no-res{padding:22px;text-align:center;color:var(--text3);font-size:13px}

/* CONTENT */
.content{flex:1;min-width:0}

/* EMPTY STATE */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:460px;text-align:center}
.empty-icon{font-size:68px;opacity:.2;margin-bottom:18px}
.empty-title{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--text3);margin-bottom:10px}
.empty-desc{color:var(--text3);font-size:13.5px;max-width:320px;line-height:1.75}
.quick-picks{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.q-btn{padding:7px 15px;border-radius:18px;background:rgba(79,134,247,.09);border:1px solid rgba(79,134,247,.2);color:#6aa0df;font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .18s}
.q-btn:hover{background:rgba(79,134,247,.18);color:#9dc4f7}

/* DISEASE VIEW */
.d-view{display:none}
.d-hdr{background:linear-gradient(135deg,rgba(79,134,247,.1),rgba(167,139,250,.07));border:1px solid rgba(79,134,247,.22);border-radius:18px;padding:24px 28px;margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.d-hdr-label{font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:7px}
.d-hdr-name{font-family:var(--mono);font-size:26px;font-weight:700;background:linear-gradient(90deg,#fff,#a8c8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:11px;line-height:1.2}
.sec-tags{display:flex;gap:6px;flex-wrap:wrap}
.sec-tag{padding:3px 8px;border-radius:9px;font-family:var(--mono);font-size:10px}
.back-btn{padding:7px 15px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-family:var(--mono);font-size:11px;white-space:nowrap;transition:all .18s;flex-shrink:0}
.back-btn:hover{background:rgba(255,255,255,.09);color:var(--text)}

/* SECTION CARDS */
.sec-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:15px;padding:18px 22px;margin-bottom:13px;opacity:0;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease,border-color .25s}
.sec-card.vis{opacity:1;transform:translateY(0)}
.sec-card:hover{border-color:rgba(255,255,255,.11)}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sec-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sec-title{font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.sec-text{color:#b8cde4;font-size:13.5px;line-height:1.8}
.blist{list-style:none}
.blist li{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px;color:#b8cde4;line-height:1.62}
.blist li:last-child{border-bottom:none}
.bdot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex-shrink:0}
.sub-grp{margin-bottom:14px}
.sub-grp:last-child{margin-bottom:0}
.sub-lbl{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.72;margin-bottom:7px}

/* DISCLAIMER */
.disclaimer{margin-top:8px;padding:10px 15px;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);border-radius:9px;font-family:var(--mono);font-size:10px;color:#253448;line-height:1.6}

/* STATS BAR */
.stats-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.stat-chip{padding:4px 11px;border-radius:8px;font-size:11px;font-family:var(--mono);display:flex;align-items:center;gap:5px}

/* RESPONSIVE */
@media(max-width:820px){
  .wrap{flex-direction:column;padding:16px}
  .sidebar{width:100%;position:static}
  .d-list{max-height:220px}
  .hdr-badge{display:none}
  .d-hdr{flex-direction:column}
  .d-hdr-name{font-size:21px}
}
@media(max-width:480px){
  .hdr{padding:12px 16px}
  .hdr-title{font-size:15px}
}
</style>
</head>

const CATEGORIES = {
  "All": Object.keys(DISEASE_DATA),
  "Skin & Hair": ["Acne (Pimple)","Boils","Burns","Eczema","Hair Fall","Leprosy","Psoriasis","Ringworm","Scabies","Skin Diseases","Vitiligo","Chickenpox","Keloid Scars"],
  "Digestive":   ["Constipation","Dysentery","Fatty Liver","Gas Trouble","Gastritis","Giardiasis","H. Pylori Infection","Inflammatory Bowel Disease","Jaundice","Liver Cirrhosis","NAFLD (Non-Alcoholic Fatty Liver)","Peptic Ulcer","Piles (Hemorrhoids)","Vomiting","Worm Infection"],
  "Heart":       ["Anemia","Angina Pectoris","Arrhythmia","Congestive Heart Failure","Hemophilia","Hypertension","Hypotension","Low Platelet Count","Low WBC Count"],
  "Respiratory": ["Asthma","Dry Cough","Pneumonia","Respiratory Tract Infection","Tuberculosis","Wet Cough"],
  "Bones":       ["Arthritis","Joint Pain","Paralysis","Rheumatoid Arthritis","Tremor"],
  "Mental":      ["Anxiety","Depression","Hysteria","Insomnia","Schizophrenia"],
  "Women":       ["Amenorrhea","Breast Cancer","Breast Enlargement","Cervical Dysplasia","Infertility (Female)","Morning Sickness","Ovarian Cyst","PCOD (Polycystic Ovarian Disease)","Pelvic Pain","PID (Pelvic Inflammatory Disease)","Vaginal Discharge (Leucorrhoea)","Vaginal Dryness","Vaginal Infection","Vulvovaginitis","Menorrhagia"],
  "Men":         ["Erectile Dysfunction","Hydrocele","Night Fall","Penile Papules","Penis Yeast Infection","Phimosis","Varicocele"],
  "Eyes/ENT":    ["Bell\'s Palsy","Conjunctivitis","Ear Infection","Glaucoma","Headache","Migraine","Ocular Hypertension","Vertigo"],
  "Infections":  ["Chikungunya","Dengue Fever","Fever","HFMD (Hand, Foot & Mouth Disease)","HIV / AIDS","Malaria","Meningitis","Typhoid Fever","Viral Fever","Viral Infection","Leishmaniasis","Mucormycosis"],
  "Kidney":      ["Chronic Kidney Disease","Cystitis","Gall Bladder Stone","Kidney Stone","Urinary Tract Infection"],
  "Metabolic":   ["Blood Sugar / Diabetes","Dehydration","Heat Stroke","Hypothyroidism","Obesity","Thyroid Disorders","Weakness and Tiredness","Scurvy","Hypothermia","Inflammation"],
};

const QUICK = ["Hypertension","Dengue Fever","Asthma","Malaria","Acne (Pimple)","Diabetes"];

const SECTIONS = [
  {key:"overview",      label:"Overview",         icon:"📋", color:"#4f86f7"},
  {key:"causes",        label:"Causes",           icon:"🔬", color:"#f7934f"},
  {key:"symptoms",      label:"Symptoms",         icon:"🩺", color:"#f74f7b"},
  {key:"diagnosis",     label:"Diagnosis",        icon:"🧪", color:"#9b4ff7"},
  {key:"treatment",     label:"Treatment",        icon:"💊", color:"#4ff77a"},
  {key:"medications",   label:"Medications",      icon:"🏥", color:"#4fc5f7"},
  {key:"home_remedies", label:"Home Remedies",    icon:"🌿", color:"#f7d84f"},
];

/* ── STATE ───────────────────────────────────── */
let activeCat = "All", selectedDisease = null, query = "";

/* ── HELPERS ─────────────────────────────────── */
const $id = id => document.getElementById(id);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

function buildCategories(){
  const strip = $id("catStrip");
  Object.keys(CATEGORIES).forEach(cat => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (cat==="All"?" active":"");
    b.textContent = cat;
    b.dataset.cat = cat;
    b.addEventListener("click",()=>{
      activeCat = cat;
      strip.querySelectorAll(".cat-btn").forEach(x=>x.classList.toggle("active",x.dataset.cat===cat));
      renderList();
    });
    strip.appendChild(b);
  });
}

function renderList(){
  const list = $id("dList");
  const pool = CATEGORIES[activeCat] || Object.keys(DISEASE_DATA);
  const q = query.toLowerCase();
  const filtered = pool.filter(d => d.toLowerCase().includes(q) && DISEASE_DATA[d]);

  $id("countLbl").textContent = filtered.length + " CONDITIONS";
  list.innerHTML = "";
  if(!filtered.length){ list.innerHTML='<div class="no-res">No diseases found</div>'; return; }

  filtered.forEach((disease,i) => {
    const item = document.createElement("div");
    item.className = "d-item" + (disease===selectedDisease?" active":"");
    item.innerHTML = `<div class="d-num">${i+1}</div><div class="d-name">${esc(disease)}</div>`;
    item.addEventListener("click",()=>selectDisease(disease));
    list.appendChild(item);
  });
}

function buildQuickPicks(){
  const wrap = $id("quickPicks");
  QUICK.forEach(name => {
    const match = Object.keys(DISEASE_DATA).find(d=>d.toLowerCase().includes(name.toLowerCase()));
    if(!match) return;
    const b = document.createElement("button");
    b.className = "q-btn"; b.textContent = name;
    b.addEventListener("click",()=>selectDisease(match));
    wrap.appendChild(b);
  });
}

function selectDisease(disease){
  selectedDisease = disease;
  renderList();
  $id("emptyState").style.display = "none";
  $id("dView").style.display      = "block";
  $id("viewTitle").textContent    = disease;
  $id("secContainer").innerHTML   = "";
  $id("statsBar").innerHTML       = "";

  // Tags
  const tags = $id("viewTags"); tags.innerHTML = "";
  const d = DISEASE_DATA[disease] || {};
  SECTIONS.forEach(s => {
    const val = d[s.key];
    const empty = !val || (Array.isArray(val)&&!val.length) || (typeof val==="string"&&!val);
    if(empty) return;
    const span = document.createElement("span");
    span.className = "sec-tag";
    span.style.cssText = `background:${s.color}18;border:1px solid ${s.color}33;color:${s.color}`;
    span.textContent = s.label;
    tags.appendChild(span);
  });

  // Stats chips
  const statsBar = $id("statsBar");
  const statItems = [
    {field:"causes",      label:"Causes",      icon:"🔬"},
    {field:"symptoms",    label:"Symptoms",    icon:"🩺"},
    {field:"medications", label:"Medications", icon:"💊"},
    {field:"home_remedies",label:"Remedies",  icon:"🌿"},
  ];
  statItems.forEach(si => {
    const val = d[si.field];
    const count = Array.isArray(val) ? val.length : 0;
    if(!count) return;
    const chip = document.createElement("div");
    chip.className = "stat-chip";
    chip.style.background = "rgba(255,255,255,.03)";
    chip.style.border = "1px solid rgba(255,255,255,.07)";
    chip.style.color = "var(--text3)";
    chip.innerHTML = `${si.icon} <span style="color:var(--text2);font-weight:700">${count}</span> ${si.label}`;
    statsBar.appendChild(chip);
  });

  window.scrollTo({top:0,behavior:"smooth"});
  renderSections(d);
}

function renderSections(d){
  const container = $id("secContainer");
  container.innerHTML = "";

  SECTIONS.forEach((sec, idx) => {
    const val = d[sec.key];
    const isEmpty = !val || (Array.isArray(val)&&!val.length) || (typeof val==="string"&&val.trim()==="");
    if(isEmpty) return;

    const card = document.createElement("div");
    card.className = "sec-card";

    let bodyHTML = "";
    if(typeof val==="string"){
      bodyHTML = `<p class="sec-text">${esc(val)}</p>`;
    } else if(Array.isArray(val)){
      bodyHTML = buildBulletHTML(val, sec.color);
    } else if(typeof val==="object"){
      bodyHTML = Object.entries(val).map(([k,v])=>{
        if(!v||(Array.isArray(v)&&!v.length)) return "";
        const items = Array.isArray(v) ? buildBulletHTML(v, sec.color, true) : `<p class="sec-text" style="font-size:13px">${esc(v)}</p>`;
        return `<div class="sub-grp"><div class="sub-lbl" style="color:${sec.color}">${esc(k)}</div>${items}</div>`;
      }).join("");
    }

    card.innerHTML = `
      <div class="sec-head">
        <div class="sec-ico" style="background:${sec.color}1a;border:1px solid ${sec.color}30">${sec.icon}</div>
        <div class="sec-title" style="color:${sec.color}">${sec.label}</div>
      </div>
      <div>${bodyHTML}</div>`;

    container.appendChild(card);
    setTimeout(()=>card.classList.add("vis"), idx*100);
  });

  const disc = document.createElement("div");
  disc.className = "disclaimer";
  disc.textContent = "⚠ DISCLAIMER: This reference is sourced from the Pharmarocks Diseases & Treatment book for educational purposes only. Always consult a qualified healthcare professional before starting any treatment or medication.";
  container.appendChild(disc);
}

function buildBulletHTML(items, color, small=false){
  const size = small ? "13px" : "13.5px";
  return `<ul class="blist">${items.map(item=>
    `<li style="font-size:${size}"><span class="bdot" style="background:${color}"></span><span>${esc(item)}</span></li>`
  ).join("")}</ul>`;
}

/* ── EVENTS ──────────────────────────────────── */
$id("backBtn").addEventListener("click",()=>{
  selectedDisease = null;
  $id("emptyState").style.display = "flex";
  $id("dView").style.display      = "none";
  renderList();
});

$id("searchInp").addEventListener("input", e=>{
  query = e.target.value;
  renderList();
});

/* ── INIT ────────────────────────────────────── */
buildCategories();
buildQuickPicks();
renderList();
</script>
